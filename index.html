<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Video</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
    }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .player {
      width: min(100%, 960px);
      aspect-ratio: 16 / 9;
      border: 0;
      display: block;
      background: #000;
    }
    @media (max-width: 600px) {
      body { padding: 12px; }
    }
  </style>
</head>
<body>
  <iframe
    class="player"
    src="https://drive.google.com/file/d/1wvcAIuyi1Fdi6X8nF6jgiLgMaplN18NX/preview"
    title="Video player"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>
</body>
</html>
